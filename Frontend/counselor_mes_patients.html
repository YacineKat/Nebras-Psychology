<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes patients - Counselor | Nebras</title>
    <link rel="stylesheet" href="./css/counselor_style.css">
    <link rel="icon" type="image/png" href="./assets/image/logo.png">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <img src="./assets/image/logo.png" alt="Nebras Logo">
            </div>
            <nav class="nav-menu">
                <a href="counselor_dashboard.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z" fill="currentColor"/></svg>
                    <span>Tableau de bord</span>
                </a>
                <a href="counselor_mes_patients.html" class="nav-item active">
                    <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/></svg>
                    <span>Mes patients</span>
                    <span class="badge">0</span>
                </a>
                <a href="counselor_emploi_du_temps.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zM9 14H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2zm-8 4H7v-2h2v2zm4 0h-2v-2h2v2zm4 0h-2v-2h2v2z" fill="currentColor"/></svg>
                    <span>Emploi du temps</span>
                </a>
                <a href="counselor_messagerie.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z" fill="currentColor"/></svg>
                    <span>Messagerie</span>
                    <span class="badge">5</span>
                </a>
                <a href="counselor_honoraires.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.5 15h-3v-2h3v2zm0-4h-3V7h3v6z" fill="currentColor"/></svg>
                    <span>Honoraires</span>
                </a>
                <a href="counselor_VIP.html" class="nav-item vip-link" onclick="checkVIPStatus(event)">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9 16 14 19 22 12 17 5 22 8 14 2 9 9 9 12 2"/></svg>
                    <span>Espace VIP</span>
                    <span class="vip-status-badge" id="vipStatusBadge">Non activé</span>
                </a>
            </nav>
            <a href="counselor_profil.html" class="nav-item profile-link">
                <div class="user-avatar">
                    <img src="./image/24d0759cbb02c3157112d0ef0f8463b1.jpg" alt="Photo profil" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover;">
                </div>
                <div class="user-info"><span class="user-name">Sarah Mansouri</span></div>
            </a>
        </div>

        <div class="main-content">
            <header class="page-header">
                <div><h1>Mes patients</h1><p class="subtitle">Gérez vos patients et leurs notes</p></div>
            </header>

            <!-- Barre de recherche améliorée avec filtres -->
            <div class="search-section-advanced">
                <div class="search-main">
                    <div class="search-bar-advanced">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B39DDB" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="searchInput" placeholder="Rechercher par nom..." onkeyup="filterPatients()">
                    </div>
                    <button class="search-btn" onclick="filterPatients()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        Rechercher
                    </button>
                    <button class="reset-btn" onclick="resetFilters()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        Réinitialiser
                    </button>
                </div>
                <div class="filters-row">
                    <select id="filterMotif" class="filter-select" onchange="filterPatients()">
                        <option value="">Tous les motifs</option>
                        <option value="Anxiété">Anxiété</option>
                        <option value="Stress">Stress</option>
                        <option value="Confiance en soi">Confiance en soi</option>
                        <option value="Dépression">Dépression</option>
                        <option value="Anxiété sociale">Anxiété sociale</option>
                        <option value="Stress post-traumatique">Stress post-traumatique</option>
                    </select>
                    <select id="filterDate" class="filter-select" onchange="filterPatients()">
                        <option value="">Toutes les dates</option>
                        <option value="7">Dernière séance dans les 7 jours</option>
                        <option value="30">Dernière séance dans les 30 jours</option>
                        <option value="90">Dernière séance dans les 90 jours</option>
                    </select>
                </div>
            </div>

            <div class="patients-grid" id="patientsGrid">
                <!-- Les cartes patients seront générées dynamiquement -->
            </div>
        </div>
    </div>

    <!-- MODAL NOTES PATIENT -->
    <div id="notesModal" class="notes-modal">
        <div class="notes-modal-content">
            <div class="notes-modal-header">
                <h2><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#091346" stroke-width="2"><path d="M16 3h5v5M14 10l6-6M3 16l8-8M3 21h18"/></svg> Notes patient</h2>
                <button class="close-modal" onclick="closeNotesModal()">&times;</button>
            </div>
            <div id="notesList" class="notes-list">
                <!-- Les notes seront affichées ici -->
            </div>
            <div class="add-note-section">
                <textarea id="newNoteText" rows="3" placeholder="Ajouter une nouvelle note sur ce patient..."></textarea>
                <button class="add-note-btn" onclick="addNote()">+ Ajouter la note</button>
            </div>
        </div>
    </div>

<script src="js/api.js"></script>
<script>
(function() {
    var userStr = localStorage.getItem('nebras_user');
    if (userStr) {
        try {
            var user = JSON.parse(userStr);
            var name = user.fullname || user.email || '';
            document.querySelectorAll('.user-name').forEach(function(el) { el.textContent = name; });
        } catch(e) {}
    }
})();
function showToast(message, type = 'success') {
    const container = document.querySelector('.toast-container') || (() => { const c = document.createElement('div'); c.className = 'toast-container'; document.body.appendChild(c); return c; })();
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
<script src="js/counselor_mes_patients.js" defer></script>
</body>
</html>
