<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres - Admin | Nebras</title>
    <link rel="stylesheet" href="./css/admin_style.css">
    <link rel="icon" type="image/png" href="./assets/image/logo.png">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo"><img src="./assets/image/logo.png" alt="Nebras Logo"></div>
            <nav class="nav-menu">
                <a href="admin_dashboard.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H5a2 2 0 0 1-2-2z"/></svg><span>Tableau de bord</span></a>
                <a href="admin_utilisateurs.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Utilisateurs</span><span class="badge" id="usersBadge"></span></a>
                <a href="admin_validation.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>Validations</span><span class="badge" id="validationsBadge"></span></a>
                <a href="admin_paiements.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8l-4 8-4-8"/></svg><span>Paiements</span><span class="badge" id="paymentsBadge"></span></a>
                <a href="admin_statistiques.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-3"/><path d="M12 2v12m0 0l-3-3m3 3l3-3"/></svg>
                    <span>Statistiques</span>
                </a>
            </nav>
            <a href="admin.html" class="nav-item profile-link"><div class="user-avatar">A</div><div class="user-info"><span class="user-name">Admin</span></div><span class="settings-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.1A10 10 0 0 0 12 18a10 10 0 0 0 6.33-2.2z"/></svg></span></a>
            <a href="#" class="nav-item" onclick="logout()" style="color: #e74c3c;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Déconnexion</span>
            </a>
        </div>

        <div class="main-content">
            <header class="page-header"><div><h1>Paramètres</h1><p class="subtitle">Configurez votre plateforme</p></div><div class="header-icons"><span id="lastSaved" class="last-saved"></span></div></header>

            <div class="admin-section">
                <div class="settings-group">
                    <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.1A10 10 0 0 0 12 18a10 10 0 0 0 6.33-2.2z"/></svg> Paramètres généraux</h3>
                    <div class="setting-row"><label>Nom du site</label><input type="text" id="siteName" placeholder="Nebras"></div>
                    <div class="setting-row"><label>Email contact</label><input type="email" id="contactEmail" placeholder="contact@nebras.dz"></div>
                    <div class="setting-row"><label>Téléphone</label><input type="tel" id="phone" placeholder="+213 XXX XXX XXX"></div>
                </div>

                <div class="settings-group">
                    <h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><path d="M16 8l-4 8-4-8"/></svg> Tarification</h3>
                    <div class="setting-row"><label>Prix consultation</label><input type="number" id="consultationPrice" placeholder="1000"> DA</div>
                    <div class="setting-row"><label>Prix VIP / mois</label><input type="number" id="vipMonthlyPrice" placeholder="5000"> DA</div>
                    <div class="setting-row"><label>Commission plateforme</label><input type="number" id="platformCommission" placeholder="10"> %</div>
                </div>

                <button class="save-btn" onclick="saveSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"/><polygon points="18 2 22 6 12 16 8 16 8 12 18 2"/></svg> Enregistrer</button>
            </div>
        </div>
    </div>

<style>
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="js/api.js"></script>
<script>
function normalizeStringField(id) {
    return document.getElementById(id).value.trim();
}

function parsePositiveNumber(id, label) {
    const raw = document.getElementById(id).value.trim();
    const value = Number.parseInt(raw, 10);
    if (!Number.isFinite(value) || value <= 0) {
        throw new Error(label + ' invalide');
    }
    return value;
}

async function loadSettings() {
    try {
        const data = await adminAPI.getSettings();
        const s = data.settings || {};
        document.getElementById('siteName').value = s.siteName || '';
        document.getElementById('contactEmail').value = s.contactEmail || '';
        document.getElementById('phone').value = s.phone || '';
        document.getElementById('consultationPrice').value = s.consultationPrice ?? 1000;
        document.getElementById('vipMonthlyPrice').value = s.vipMonthlyPrice ?? 5000;
        document.getElementById('platformCommission').value = s.platformCommission ?? 10;
        const savedEl = document.getElementById('lastSaved');
        if (s.updatedAt) {
            savedEl.textContent = 'Dernière mise à jour: ' + new Date(s.updatedAt).toLocaleString('fr-FR');
        } else {
            savedEl.textContent = '';
        }
    } catch (e) {
        showToast(e.message || 'Impossible de charger les paramètres', 'error');
    }
}

async function saveSettings() {
    let payload;
    try {
        const siteName = normalizeStringField('siteName');
        const contactEmail = normalizeStringField('contactEmail');
        const phone = normalizeStringField('phone');
        const price = parsePositiveNumber('consultationPrice', 'Prix consultation');
        const vip = parsePositiveNumber('vipMonthlyPrice', 'Prix VIP');
        const commission = Number.parseInt(document.getElementById('platformCommission').value.trim(), 10);

        if (!siteName) throw new Error('Le nom du site est requis');
        if (!contactEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contactEmail)) throw new Error('Email contact invalide');
        if (!Number.isFinite(commission) || commission < 0 || commission > 100) throw new Error('Commission doit être entre 0 et 100');

        payload = {
            siteName,
            contactEmail,
            consultationPrice: price,
            vipMonthlyPrice: vip,
            platformCommission: commission
        };

        // Include phone only when user provided a value (placeholder shouldn't be submitted)
        if (phone) payload.phone = phone;
    } catch (validationError) {
        showToast(validationError.message, 'error');
        return;
    }

    const btn = document.querySelector('.save-btn');
    btn.disabled = true;
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="animation:spin 1s linear infinite;"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Enregistrement...';

    try {
        await adminAPI.updateSettings(payload);
        await loadSettings();
        showToast('Paramètres enregistrés', 'success');
    } catch (e) {
        showToast(e.message || 'Erreur enregistrement', 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 14.66V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5.34"/><polygon points="18 2 22 6 12 16 8 16 8 12 18 2"/></svg> Enregistrer';
    }
}

async function loadSidebarBadges() {
    try {
        const data = await adminAPI.getDashboard();
        const d = data.dashboard;
        document.getElementById('usersBadge').textContent = d.pendingUsers || '';
        document.getElementById('validationsBadge').textContent = d.pendingValidations || '';
        document.getElementById('paymentsBadge').textContent = d.pendingPayments || '';
    } catch (e) {}
}

loadSettings();
loadSidebarBadges();
</script>
</body>
</html>
