<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiements - Admin | Nebras</title>
    <link rel="stylesheet" href="./css/admin_style.css">
    <link rel="icon" type="image/png" href="./assets/image/logo.png">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo"><img src="./assets/image/logo.png" alt="Nebras Logo"></div>
            <nav class="nav-menu">
                <a href="admin_dashboard.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-5v-7H9v7H5a2 2 0 0 1-2-2z"/></svg><span>Tableau de bord</span></a>
                <a href="admin_utilisateurs.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Utilisateurs</span><span class="badge" id="usersBadge"></span></a>
                <a href="admin_validation.html" class="nav-item"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span>Validations</span><span class="badge" id="validationsBadge"></span></a>
                <a href="admin_paiements.html" class="nav-item active"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8l-4 8-4-8"/></svg><span>Paiements</span><span class="badge" id="paymentsBadge"></span></a>
                <a href="admin_statistiques.html" class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12v3a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4v-3"/><path d="M12 2v12m0 0l-3-3m3 3l3-3"/></svg>
                    <span>Statistiques</span>
                </a>
            </nav>
            <a href="admin.html" class="nav-item profile-link"><div class="user-avatar">A</div><div class="user-info"><span class="user-name">Admin</span></div><span class="settings-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H5.78a1.65 1.65 0 0 0-1.51 1 1.65 1.65 0 0 0 .33 1.82l.08.1A10 10 0 0 0 12 18a10 10 0 0 0 6.33-2.2z"/></svg></span></a>
            <a href="#" class="nav-item" onclick="logout()" style="color: #e74c3c;">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>Déconnexion</span>
            </a>
        </div>

        <div class="main-content">
            <header class="page-header"><div><h1>Paiements</h1><p class="subtitle">Gérez les transactions</p></div></header>

            <div class="payment-summary" id="paymentSummary">
                <div class="payment-card"><h4><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#44AA99" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8l-4 8-4-8"/></svg> Revenus totaux</h4><div class="amount" id="totalRevenue">0 DA</div><small>Ce mois</small></div>
                <div class="payment-card"><h4><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#44AA99" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> En attente</h4><div class="amount" id="pendingAmount">0 DA</div><small id="pendingCount">0 transactions</small></div>
                <div class="payment-card"><h4><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#44AA99" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Validés</h4><div class="amount" id="validatedAmount">0 DA</div><small>Ce mois</small></div>
            </div>

            <div class="admin-section">
                <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> Paiements en attente</h2>
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead><tr><th>Date</th><th>Utilisateur</th><th>Type</th><th>Montant</th><th>Référence</th><th>Actions</th></tr></thead>
                        <tbody id="paymentsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script src="js/api.js"></script>
<script>
async function loadPayments() {
    try {
        const [summary, payments] = await Promise.all([
            adminAPI.getPaymentsSummary(),
            adminAPI.getPayments({ status: 'pending' })
        ]);

        document.getElementById('totalRevenue').textContent = summary.totalRevenue.toLocaleString() + ' DA';
        document.getElementById('pendingAmount').textContent = summary.pendingAmount.toLocaleString() + ' DA';
        document.getElementById('pendingCount').textContent = summary.pendingCount + ' transactions';
        document.getElementById('validatedAmount').textContent = summary.validatedAmount.toLocaleString() + ' DA';
        document.getElementById('paymentsBadge').textContent = summary.pendingCount;

        const tbody = document.getElementById('paymentsTableBody');
        tbody.innerHTML = '';

        if (payments.transactions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:#999;">Aucun paiement en attente</td></tr>';
            return;
        }

        payments.transactions.forEach(t => {
            const typeLabel = { consultation: 'Consultation', vip_subscription: 'Abonnement VIP' }[t.type] || t.type;
            const dateStr = new Date(t.date).toLocaleDateString('fr-FR');

            tbody.innerHTML += `<tr>
                <td>${dateStr}</td>
                <td>${escapeHtml(t.userName)}</td>
                <td>${typeLabel} ${t.type === 'consultation' ? '<span class="psychologue-badge">Consultation</span>' : ''}</td>
                <td>${t.amount.toLocaleString()} DA</td>
                <td>${escapeHtml(t.reference || '-')}</td>
                <td><div class="action-btns">
                    <button class="action-btn primary" onclick="validatePayment('${t.id}','${escapeHtml(t.userName)}')"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Valider</button>
                    <button class="action-btn danger" onclick="rejectPayment('${t.id}','${escapeHtml(t.userName)}')"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Refuser</button>
                </div></td>
            </tr>`;
        });
    } catch (e) {
        showToast('Erreur chargement paiements', 'error');
        console.error(e);
    }
}

function validatePayment(id, userName) {
    showConfirmModal({
        title: 'Valider',
        icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>',
        message: `Valider le paiement de <strong>${escapeHtml(userName)}</strong> ?`,
        confirmText: 'Valider',
        confirmClass: 'primary',
        onConfirm: async () => {
            try {
                await adminAPI.validatePayment(id);
                showToast('Paiement validé', 'success');
                loadPayments();
            } catch (e) {
                showToast('Erreur validation', 'error');
            }
        }
    });
}

function rejectPayment(id, userName) {
    showPromptModal({
        title: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Refuser',
        bodyHtml: `<p>Refuser le paiement de <strong>${escapeHtml(userName)}</strong> ?</p><div class="modal-form-row"><label>Motif (optionnel)</label><textarea id="rejectReason" placeholder="Raison du refus..."></textarea></div>`,
        confirmText: 'Refuser',
        confirmClass: 'danger',
        onConfirm: async () => {
            const reason = document.getElementById('rejectReason')?.value || '';
            try {
                await adminAPI.rejectPayment(id, reason);
                showToast('Paiement refusé', 'success');
                loadPayments();
            } catch (e) {
                showToast('Erreur refus', 'error');
            }
        }
    });
}

loadPayments();
</script>
</body>
</html>
