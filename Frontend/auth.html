<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nebras - Authentification</title>
    <link rel="stylesheet" href="./css/hom.css"/>
    <link rel="icon" type="image" href="./assets/image/logo.png">
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="./assets/image/logo.png" alt="Nebras Logo"/>
        </div>
        <div class="nav-links">
            <a href="home.html">Accueil</a>
            <a href="rule.html">Règles</a>
            <a href="#etapes">Étapes</a>
            <a href="#psychologues">Psychologues</a>
            <a href="#Nos offres">Nos offres</a>
        </div>
        <div class="button-group">
            <button onclick="goToHome()" class="btn-signin">Accueil</button>
        </div>
    </div>

    <div class="auth-box">
        <div id="login" class="form active">
            <h2>Connexion</h2>
            <input type="email" id="loginEmail" placeholder="Email" class="input">
            <input type="password" id="loginPassword" placeholder="Mot de passe" class="input">
            <button class="btn" onclick="handleLogin()">Se connecter</button>
            <p>Pas de compte ? <a href="#" onclick="showRegister(); return false;">S'inscrire</a></p>
        </div>

        <div id="register" class="form">
            <h2>Inscription</h2>
            <select id="regUserType" class="input">
                <option value="patient">Patient</option>
                <option value="psychologue">Psychologue</option>
                <option value="counselor">Counselor</option>
            </select>
            <input type="text" id="regFullname" placeholder="Nom complet" class="input">
            <input type="email" id="regEmail" placeholder="Email" class="input">
            <input type="password" id="regPassword" placeholder="Mot de passe" class="input">
            <input type="password" id="regConfirmPassword" placeholder="Confirmer le mot de passe" class="input">
            <div class="check-box">
                <input type="checkbox" id="rules">
                <label for="rules">J'accepte les <a href="rule.html">règles</a> du site</label>
            </div>
            <button class="btn" onclick="handleRegister()">S'inscrire</button>
            <p>Déjà un compte ? <a href="#" onclick="showLogin(); return false;">Se connecter</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="currentYear"></span> Nebras - Psychologie en ligne</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();
        
        if (isLoggedIn()) {
            const user = getCurrentUser();
            if (user) redirectByUserType(user.userType);
        }

        window.showLogin = function() {
            document.getElementById('login').classList.add('active');
            document.getElementById('register').classList.remove('active');
        };
        
        window.showRegister = function() {
            document.getElementById('login').classList.remove('active');
            document.getElementById('register').classList.add('active');
        };
        
        window.handleLogin = async function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                alert('Veuillez entrer votre email et mot de passe');
                return;
            }
            
            try {
                const result = await authAPI.login({ email, password });
                localStorage.setItem('nebras_token', result.token);
                localStorage.setItem('nebras_user', JSON.stringify(result.user));
                setTimeout(() => redirectByUserType(result.user.userType), 300);
            } catch(e) {
                alert('Erreur: ' + e.message);
            }
        };
        
        window.handleRegister = async function() {
            const userType = document.getElementById('regUserType').value;
            const fullname = document.getElementById('regFullname').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const rules = document.getElementById('rules');
            
            if (!fullname || !email || !password) {
                alert('Veuillez remplir tous les champs');
                return;
            }
            if (password !== confirmPassword) {
                alert('Les mots de passe ne correspondent pas');
                return;
            }
            if (!rules.checked) {
                alert('Vous devez accepter les règles du site');
                return;
            }
            
            try {
                const result = await authAPI.register({ email, password, fullname, userType });
                localStorage.setItem('nebras_token', result.token || result.user?.token);
                localStorage.setItem('nebras_user', JSON.stringify(result.user));
                setTimeout(() => redirectByUserType(userType), 300);
            } catch(e) {
                alert('Erreur: ' + e.message);
            }
        };
        
        window.goToHome = function() {
            window.location.href = 'home.html';
        };
    </script>
</body>
</html>
