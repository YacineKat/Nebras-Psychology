                </div>
            </header>

            <div class="messagerie-layout">
                <!-- Liste des conversations - VIDE -->
                <div class="conversations-panel">
                    <div class="conversations-header">
                        <h2>Messages</h2>
                        <div class="header-icons">
                            <button class="icon-btn-msg">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="search-bar-msg">
                        <svg class="search-icon-msg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
                        </svg>
                        <input type="text" placeholder="Rechercher une conversation...">
                    </div>

                    <div class="conversations-list">
                        <!-- Liste vide -->
                        <div class="empty-conversations">
                            <div class="empty-icon">💬</div>
                            <p>Aucune conversation</p>
                        </div>
                    </div>
                </div>

                <!-- Zone de conversation - VIDE -->
                <div class="conversation-area">
                    <div class="empty-conversation">
                        <div class="empty-icon-large">📭</div>
                        <h3>Sélectionnez une conversation</h3>
                        <p>Choisissez un contact pour commencer à discuter</p>
                    </div>
                </div>
            </div>
        </div>
